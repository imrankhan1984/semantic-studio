[pytest]
# `network` marks tests that reach the public internet. They are excluded by
# default so the suite is deterministic and runs offline; REG-2 in the
# network-and-resource-limits specification is the one test that carries it.
# Run them deliberately with:  pytest tests -m network
addopts = -m "not network"
# `perf` marks the tests that hold a performance budget. Unlike `network` they
# run by default: a budget that is not enforced on every run is a note in a
# document, not a budget. Deselect them on a slow machine with:
#   pytest tests -m "not perf"
markers =
    network: reaches the public internet; deselected unless asked for
    perf: holds a performance budget; runs by default, deselect with -m "not perf"
